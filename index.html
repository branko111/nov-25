<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Sydney Map</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E %3Ccircle cx='32' cy='32' r='30' fill='%231d4ed8'/%3E %3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23fff' stroke-opacity='.25' stroke-width='2'/%3E %3Cg transform='rotate%28180 32 32%29' fill='none' stroke='%23fff' stroke-width='5.5' stroke-linecap='round'%3E %3Cpath d='M22.1 20.7 A15 15 0 1 0 41.9 20.7'/%3E %3Cline x1='32' y1='13' x2='32' y2='31'/%3E %3C/g%3E %3C/svg%3E">
<style>
  /* ================= SETTINGS YOU MAY CHANGE ================= */
  :root {
    --nav-bg: #0f172a;
    --nav2-bg: #1e293b;
    --nav-fg: #e2e8f0;
    --accent: #38bdf8;
    --ok: #22c55e;
    --ctrl: 52px;            /* size of heart / phone / initials buttons */
    --flag: 40px;            /* size of round flags */
    --radius: 14px;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  /* =========================================================== */

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font: inherit; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- sticky header (nav1 + nav2) ---------- */
  header { position: sticky; top: 0; z-index: 20; animation: slideDown .5s var(--ease) both; }

  /* ---------- NAV 1 : round flags ---------- */
  .nav1 {
    background: var(--nav-bg);
    padding: .6rem 1rem;
    padding-top: calc(.6rem + env(safe-area-inset-top));
  }
  .nav1 ul {
    list-style: none; display: flex; justify-content: center; align-items: center;
    gap: clamp(.45rem, 2.5vw, .9rem); flex-wrap: wrap;
  }
  .flag-btn {
    width: var(--flag); height: var(--flag); border-radius: 50%; overflow: hidden;
    border: 2px solid rgba(255,255,255,.35); padding: 0; cursor: pointer;
    background: none; display: block;
    transition: transform .2s var(--ease), border-color .15s, box-shadow .2s;
  }
  .flag-btn svg { width: 100%; height: 100%; display: block; }
  .flag-btn:hover { transform: scale(1.12); border-color: #fff; }
  .flag-btn:active { transform: scale(.95); }
  .flag-btn.active { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.45); }

  /* ---------- NAV 2 : heart / phone / initials ---------- */
  .nav2 {
    display: flex; justify-content: center; align-items: center; gap: 1rem;
    padding: .6rem 1rem;
    background: var(--nav2-bg);
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .ctrl {
    position: relative;
    width: var(--ctrl); height: var(--ctrl);
    border-radius: var(--radius); border: 2px solid transparent; cursor: pointer;
    background: rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s var(--ease), background .15s, border-color .2s;
    color: #fff;
  }
  .ctrl:hover  { background: rgba(255,255,255,.16); }
  .ctrl:active { transform: scale(.92); }
  .ctrl.set    { border-color: var(--ok); }
  .ctrl svg { width: 70%; height: 70%; display: block; }
  .ctrl svg path.h { transition: fill .35s ease; }
  .ctrl.beat svg { animation: beat .45s var(--ease); }
  #btnInitials { font-weight: 800; font-size: 1.15rem; letter-spacing: .5px; }
  #btnInitials.nudge { animation: nudge .9s ease 2; }

  /* ---------- main ---------- */
  main { max-width: 640px; margin: 1rem auto 2rem; padding: 0 16px; }

  /* initials picker */
  #picker {
    display: grid; grid-template-rows: 0fr; opacity: 0;
    transition: grid-template-rows .35s var(--ease), opacity .25s, margin .35s var(--ease);
    margin-bottom: 0;
  }
  #picker:not(.open) > .card { visibility: hidden; transition: visibility 0s .35s; }
  #picker.open { grid-template-rows: 1fr; opacity: 1; margin-bottom: 1rem; }
  #picker > .card { overflow: hidden; min-height: 0; background: #fff; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .picker-head {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--nav-bg); color: #fff; padding: .7rem 1rem; font-weight: 600;
  }
  .picker-head button {
    background: none; border: none; color: #fff; font-size: 1.5rem; line-height: 1;
    cursor: pointer; width: 32px; height: 32px; border-radius: 8px; transition: background .15s;
  }
  .picker-head button:hover { background: rgba(255,255,255,.15); }
  .grid-wrap { max-height: min(55vh, 420px); overflow-y: auto; padding: .6rem; overscroll-behavior: contain; }
  .grid {
    display: grid; gap: .35rem;
    grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
  }
  .grid button {
    height: 34px; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc;
    font-weight: 600; font-size: .85rem; color: #0f172a; cursor: pointer;
    transition: background .12s, transform .12s, color .12s, border-color .12s;
  }
  .grid button:hover { background: #e0f2fe; border-color: var(--accent); transform: translateY(-1px); }
  .grid button.selected { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* map */
  #mapBox {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    border-radius: 12px; overflow: hidden;
    background: #e2e8f0;
    box-shadow: 0 6px 24px rgba(0,0,0,.15);
    user-select: none;
    animation: rise .6s .1s var(--ease) both;
  }
  /* the image is stretched to the box, so the box (whose aspect ratio follows the image)
     maps exactly onto the 50 km × 50 km area */
  #mapImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; opacity: 0; transition: opacity .6s ease; }
  #mapBox.loaded #mapImg { opacity: 1; }
  #mapBox.noimg #mapImg { display: none; }
  #mapBox.noimg {   /* fallback grid if the image file is missing (10 % = 5 km) */
    background:
      linear-gradient(#cbd5e1 1px, transparent 1px) 0 0 / 10% 10%,
      linear-gradient(90deg, #cbd5e1 1px, transparent 1px) 0 0 / 10% 10%,
      #f8fafc;
  }
  #mapMsg {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: .75rem;
    align-items: center; justify-content: center;
    text-align: center; padding: 1.5rem; color: #334155; font-size: 1.05rem; font-weight: 500;
    background: rgba(241,245,249,.55); backdrop-filter: blur(2px);
    transition: opacity .35s ease; z-index: 3;
  }
  #mapMsg .pin { width: 46px; height: 46px; animation: bob 1.6s ease-in-out infinite; }
  #mapBox.ready #mapMsg { opacity: 0; pointer-events: none; }
  #mapBox.locating #mapMsg .pin { animation: spin 1s linear infinite; }

  /* accuracy ring + user dot */
  .acc {
    position: absolute; transform: translate(-50%, -50%); border-radius: 50%;
    background: rgba(56,189,248,.15); border: 1px solid rgba(56,189,248,.5);
    pointer-events: none; z-index: 1;
    transition: left .6s var(--ease), top .6s var(--ease), width .6s var(--ease), height .6s var(--ease);
  }
  .dot {
    position: absolute; transform: translate(-50%, -50%);
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 15px; letter-spacing: .5px;
    border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35);
    cursor: pointer; z-index: 2;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    transition: left .6s var(--ease), top .6s var(--ease), background-color .35s ease;
    animation: drop .55s var(--ease) both;
  }
  .dot::before {           /* pulse */
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 3px solid currentColor; color: var(--pulse, #38bdf8);
    animation: pulse 2s ease-out infinite; pointer-events: none;
  }
  .dot .tip {
    position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translate(-50%, 4px);
    background: #0f172a; color: #fff; padding: .4rem .65rem; border-radius: 8px;
    font-size: 13px; font-weight: 600; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .2s var(--ease);
    text-shadow: none; box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .dot .tip::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: #0f172a;
  }
  .dot .tip a { color: #7dd3fc; text-decoration: none; }
  .dot:hover .tip, .dot.show .tip { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }

  .dot .lbl {
    position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    background: rgba(15,23,42,.82); color: #fff; backdrop-filter: blur(4px);
    padding: .2rem .5rem; border-radius: 6px; pointer-events: none;
    font-size: 11px; font-weight: 600; line-height: 1.3; letter-spacing: .2px;
    white-space: nowrap; text-shadow: none; font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .dot .lbl b { font-weight: 600; }
  #mapCoords {
    position: absolute; left: 50%; bottom: 10px; z-index: 4;
    transform: translate(-50%, 12px); opacity: 0;
    display: grid; grid-template-columns: auto auto; column-gap: .45rem; align-items: center;
    max-width: calc(100% - 20px); white-space: nowrap;
    background: rgba(15,23,42,.85); color: #f8fafc; backdrop-filter: blur(6px);
    padding: .4rem .75rem; border-radius: 999px;
    font-size: clamp(11px, 2.9vw, 14px); font-weight: 600; font-variant-numeric: tabular-nums;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    transition: opacity .35s ease, transform .35s var(--ease);
    pointer-events: none;
  }
  #mapCoords.show { opacity: 1; transform: translate(-50%, 0); }
  #mapCoords svg { width: 18px; height: 18px; color: var(--accent); grid-row: span 2; }
  #mapCoords .ll { white-space: pre; }
  #mapCoords .meta { color: #94a3b8; font-weight: 500; font-size: .8em; }
  #mapCoords { border-radius: 14px; }
  .dot.edge-l .lbl { left: -6px; transform: none; align-items: flex-start; }
  .dot.edge-r .lbl { left: auto; right: -6px; transform: none; align-items: flex-end; }
  .dot.edge-b .lbl { top: auto; bottom: calc(100% + 8px); }
  .dot.edge-b .tip { bottom: auto; top: calc(100% + 10px); }
  .dot.edge-b .tip::after { top: auto; bottom: 100%; border-top-color: transparent; border-bottom-color: #0f172a; }
  .coords {
    margin-top: .6rem; text-align: center; font-size: .8rem; color: #64748b;
    font-variant-numeric: tabular-nums; min-height: 1.2em;
  }

  /* donate */
  .donate { text-align: center; margin-top: 1.5rem; animation: rise .6s .2s var(--ease) both; }
  .donate a {
    display: inline-flex; align-items: center; gap: .5rem;
    background: #635bff; color: #fff; text-decoration: none;
    padding: .85rem 1.6rem; border-radius: 999px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(99,91,255,.35);
    transition: transform .15s var(--ease), box-shadow .2s, background .2s;
  }
  .donate a:hover  { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(99,91,255,.45); background: #5146ff; }
  .donate a:active { transform: translateY(0) scale(.98); }

  /* ---------- phone sheet (replaces prompt) ---------- */
  .sheet-bg {
    position: fixed; inset: 0; z-index: 40; background: rgba(15,23,42,.55);
    display: flex; align-items: center; justify-content: center; padding: 1rem;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; max-width: 360px; background: #fff; border-radius: 16px; padding: 1.2rem;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
    transform: translateY(16px) scale(.97); transition: transform .25s var(--ease);
  }
  .sheet-bg.open .sheet { transform: none; }
  .sheet h2 { font-size: 1.05rem; margin-bottom: .8rem; }
  .sheet input {
    width: 100%; font: inherit; font-size: 1.1rem; padding: .7rem .8rem;
    border: 2px solid #cbd5e1; border-radius: 10px; outline: none; transition: border-color .15s;
  }
  .sheet input:focus { border-color: var(--accent); }
  .sheet .row { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; }
  .sheet .row button {
    border: none; border-radius: 10px; padding: .6rem 1.1rem; font-weight: 600; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .sheet .row button:active { transform: scale(.96); }
  .btn-ghost { background: #f1f5f9; color: #0f172a; }
  .btn-ghost:hover { background: #e2e8f0; }
  .btn-pri { background: var(--nav-bg); color: #fff; }
  .btn-pri:hover { background: #1e293b; }

  /* ---------- toasts (replace alert) ---------- */
  #toasts {
    position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 50; display: flex; flex-direction: column; gap: .5rem;
    width: min(92vw, 420px); pointer-events: none;
  }
  .toast {
    pointer-events: auto; cursor: pointer;
    display: flex; align-items: center; gap: .65rem;
    background: #0f172a; color: #f8fafc; border-radius: 12px; padding: .75rem .95rem;
    box-shadow: 0 10px 30px rgba(0,0,0,.3); font-size: .95rem; line-height: 1.35;
    border-left: 5px solid var(--tc, var(--accent));
    animation: toastIn .35s var(--ease) both;
    position: relative; overflow: hidden;
  }
  .toast.out { animation: toastOut .3s ease both; }
  .toast .ic {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--tc, var(--accent)); color: #0f172a;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
  }
  .toast .bar {
    position: absolute; left: 0; bottom: 0; height: 3px; background: var(--tc, var(--accent));
    opacity: .7; animation: shrink var(--dur, 3500ms) linear forwards;
  }

  /* ---------- keyframes ---------- */
  @keyframes slideDown { from { transform: translateY(-100%); } to { transform: none; } }
  @keyframes rise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes beat   { 0%{transform:scale(1)} 30%{transform:scale(1.3)} 60%{transform:scale(.92)} 100%{transform:scale(1)} }
  @keyframes nudge  { 0%,100%{transform:none} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
  @keyframes bob    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes drop   { 0%{opacity:0; transform:translate(-50%,-160%) scale(.6)} 70%{opacity:1; transform:translate(-50%,-45%) scale(1.05)} 100%{transform:translate(-50%,-50%) scale(1)} }
  @keyframes pulse  { 0%{transform:scale(1); opacity:.8} 100%{transform:scale(2.1); opacity:0} }
  @keyframes toastIn  { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(10px) scale(.96); } }
  @keyframes shrink { from { width: 100%; } to { width: 0; } }

  @media (min-width: 700px) {
    :root { --ctrl: 56px; --flag: 44px; }
    main { margin-top: 1.5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<header>
  <nav class="nav1" aria-label="Language">
    <ul id="flags"></ul>
  </nav>

  <nav class="nav2" aria-label="Profile">
    <button class="ctrl" id="btnHeart" aria-label="Gender and age">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="h" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
    <button class="ctrl" id="btnPhone" aria-label="Mobile phone">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="5" y="1.5" width="14" height="21" rx="2.6" fill="#6d4aa8"/>
        <rect x="6.6" y="3.6" width="10.8" height="16.6" rx="1" fill="#3b2a6b"/>
        <rect x="7.6" y="5"  width="2.6" height="2.6" rx=".6" fill="#38bdf8"/>
        <rect x="10.7" y="5" width="2.6" height="2.6" rx=".6" fill="#f472b6"/>
        <rect x="13.8" y="5" width="2.6" height="2.6" rx=".6" fill="#facc15"/>
        <rect x="7.6" y="8.4"  width="2.6" height="2.6" rx=".6" fill="#4ade80"/>
        <rect x="10.7" y="8.4" width="2.6" height="2.6" rx=".6" fill="#fb923c"/>
        <rect x="13.8" y="8.4" width="2.6" height="2.6" rx=".6" fill="#a78bfa"/>
        <rect x="7.6" y="11.8"  width="2.6" height="2.6" rx=".6" fill="#f87171"/>
        <rect x="10.7" y="11.8" width="2.6" height="2.6" rx=".6" fill="#22d3ee"/>
        <rect x="13.8" y="11.8" width="2.6" height="2.6" rx=".6" fill="#a3e635"/>
      </svg>
    </button>
    <button class="ctrl" id="btnInitials" aria-label="Your initials" aria-expanded="false" aria-controls="picker"></button>
  </nav>
</header>

<main>
  <div id="picker" aria-hidden="true">
    <div class="card" role="dialog" aria-label="Choose your initials">
      <div class="picker-head">
        <span>Choose your initials</span>
        <button id="pickerClose" aria-label="Close">&times;</button>
      </div>
      <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    </div>
  </div>

  <div id="mapBox">
    <img id="mapImg" alt="Map of Sydney, Australia" draggable="false">
    <div id="mapMsg">
      <svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path fill="#0ea5e9" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      <span id="mapMsgText">Tap anywhere on the page to share your location</span>
    </div>
    <div id="mapCoords" aria-live="polite">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      <span class="ll"></span><span class="meta"></span>
    </div>
  </div>
  <p class="coords" id="coords" aria-live="polite"></p>

  <div class="donate">
    <a id="donate" href="#" target="_blank" rel="noopener">&#9829; Donate with Stripe</a>
  </div>
</main>

<div class="sheet-bg" id="phoneSheet" aria-hidden="true">
  <form class="sheet" id="phoneForm" role="dialog" aria-label="Mobile phone" novalidate>
    <h2>Enter your mobile phone number:</h2>
    <input id="phoneInput" type="tel" inputmode="tel" autocomplete="tel" placeholder="04xx xxx xxx">
    <div class="row">
      <button type="button" class="btn-ghost" id="phoneCancel">Cancel</button>
      <button type="submit" class="btn-pri">OK</button>
    </div>
  </form>
</div>

<div id="toasts" role="status" aria-live="polite"></div>

<script>
/* ================= SETTINGS YOU MAY CHANGE ================= */
const STRIPE_LINK = "https://donate.stripe.com/REPLACE_WITH_YOUR_LINK";
const MAP_IMAGE   = "map/au_sy.avif";

// Top-left corner of the map image: 33°47'18.6"S 151°08'57.6"E  (as printed on au_sy.avif)
const TOP_LEFT = {
  lat: -(33 + 47 / 60 + 18.6 / 3600),   // -33.788500
  lon:   151 +  8 / 60 + 57.6 / 3600    // 151.149333
};
const AREA_KM = 50;                      // the image covers AREA_KM × AREA_KM

const HEART_STATES = [
  { color: "#ff8a8a", text: "I am a female between 18 and 35" }, // light red
  { color: "#b00020", text: "I am a female above 35" },          // dark red
  { color: "#8ecbff", text: "I am a man between 18 and 35" },    // light blue
  { color: "#0b3d91", text: "I am a man above 35" }              // dark blue
];
/* =========================================================== */

const $ = id => document.getElementById(id);
const ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

/* ---------- storage (safe) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const user = {
  heart:    store.get("heart", 0),
  phone:    store.get("phone", ""),
  initials: store.get("initials", ""),
  flag:     store.get("flag", "au"),
  pos:      null,     // {x, y, acc} in % of the map
  loc:      null      // {lat, lon, acc, src}
};

/* ---------- toasts (replace alert) ---------- */
const TOAST_TYPES = {
  info:  { c: "#38bdf8", i: "i" },
  ok:    { c: "#22c55e", i: "✓" },
  warn:  { c: "#f59e0b", i: "!" },
  error: { c: "#ef4444", i: "!" }
};
function toast(msg, type = "info", opts = {}) {
  const t = TOAST_TYPES[type] || TOAST_TYPES.info;
  const color = opts.color || t.c;
  const dur = opts.duration || 3500;
  const box = $("toasts");
  // keep the stack short
  while (box.children.length >= 3) box.firstElementChild.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.style.setProperty("--tc", color);
  el.style.setProperty("--dur", dur + "ms");
  el.innerHTML = `<span class="ic">${opts.icon || t.i}</span><span class="msg"></span><span class="bar"></span>`;
  el.querySelector(".msg").textContent = msg;
  const close = () => { if (el.classList.contains("out")) return; el.classList.add("out"); setTimeout(() => el.remove(), 300); };
  el.addEventListener("click", close);
  box.appendChild(el);
  setTimeout(close, dur);
}

/* ---------- flags (nav1) ---------- */
function star(cx, cy, R, r, n) {
  let d = "";
  for (let i = 0; i < n * 2; i++) {
    const a = Math.PI / n * i - Math.PI / 2;
    const rad = i % 2 ? r : R;
    d += (i ? "L" : "M") + (cx + rad * Math.cos(a)).toFixed(1) + "," + (cy + rad * Math.sin(a)).toFixed(1);
  }
  return `<path d="${d}Z" fill="#fff"/>`;
}
// Union Jack drawn in a size×size square (central 30×30 crop of the 60×30 flag)
function unionJack(id, x, y, size) {
  return `<svg x="${x}" y="${y}" width="${size}" height="${size}" viewBox="15 0 30 30">
    <clipPath id="${id}s"><path d="M0,0v30h60v-30z"/></clipPath>
    <clipPath id="${id}t"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath>
    <g clip-path="url(#${id}s)">
      <path d="M0,0v30h60v-30z" fill="#012169"/>
      <path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/>
      <path d="M0,0L60,30M60,0L0,30" clip-path="url(#${id}t)" stroke="#C8102E" stroke-width="4"/>
      <path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/>
      <path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/>
    </g></svg>`;
}
const FLAGS = {
  au: id => `<rect width="512" height="512" fill="#012169"/>${unionJack(id, 0, 0, 256)}
    ${star(128, 384, 72, 32, 7)}
    ${star(384, 100, 34, 15, 7)}${star(296, 230, 34, 15, 7)}${star(452, 205, 34, 15, 7)}
    ${star(384, 420, 38, 17, 7)}${star(420, 300, 18, 8, 5)}`,
  fr: () => `<rect width="171" height="512" fill="#002654"/><rect x="171" width="170" height="512" fill="#fff"/><rect x="341" width="171" height="512" fill="#ce1126"/>`,
  de: () => `<rect width="512" height="171" fill="#000"/><rect y="171" width="512" height="170" fill="#dd0000"/><rect y="341" width="512" height="171" fill="#ffce00"/>`,
  es: () => `<rect width="512" height="512" fill="#aa151b"/><rect y="128" width="512" height="256" fill="#f1bf00"/>`,
  gb: id => unionJack(id, 0, 0, 512),
  us: () => {
    let s = "";
    for (let i = 0; i < 13; i++) s += `<rect y="${(i * 512 / 13).toFixed(2)}" width="512" height="${(512 / 13 + .5).toFixed(2)}" fill="${i % 2 ? "#fff" : "#b22234"}"/>`;
    s += `<rect width="256" height="${(7 * 512 / 13).toFixed(2)}" fill="#3c3b6e"/>`;
    for (let r = 0; r < 9; r++) for (let c = 0; c < (r % 2 ? 5 : 6); c++)
      s += star(21 + c * 42 + (r % 2 ? 21 : 0), 20 + r * 21.5, 11, 4.5, 5);
    return s;
  }
};
function renderFlags() {
  const ul = $("flags");
  ul.innerHTML = Object.keys(FLAGS).map(code =>
    `<li><button class="flag-btn${code === user.flag ? " active" : ""}" data-flag="${code}" aria-label="${code}">
       <svg viewBox="0 0 512 512" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${FLAGS[code]("f" + code)}</svg>
     </button></li>`).join("");
  ul.addEventListener("click", e => {
    const b = e.target.closest(".flag-btn"); if (!b) return;
    user.flag = b.dataset.flag; store.set("flag", user.flag);
    ul.querySelectorAll(".flag-btn").forEach(x => x.classList.toggle("active", x === b));
  });
}

/* ---------- nav2 controls ---------- */
function paintHeart() {
  const s = HEART_STATES[user.heart] || HEART_STATES[0];
  $("btnHeart").querySelector("path.h").setAttribute("fill", s.color);
  drawDot();
}
function paintPhone() {
  $("btnPhone").classList.toggle("set", !!user.phone);
  $("btnPhone").title = user.phone || "Add your mobile phone";
}
function paintInitials() {
  const b = $("btnInitials");
  b.textContent = user.initials || "?";
  b.classList.toggle("set", !!user.initials);
  document.querySelectorAll("#grid button").forEach(x => x.classList.toggle("selected", x.textContent === user.initials));
}

$("btnHeart").addEventListener("click", () => {
  user.heart = (user.heart + 1) % HEART_STATES.length;
  store.set("heart", user.heart);
  paintHeart();
  const b = $("btnHeart");
  b.classList.remove("beat"); void b.offsetWidth; b.classList.add("beat");
  const s = HEART_STATES[user.heart];
  toast(s.text, "info", { color: s.color, icon: "♥" });
});

/* phone sheet (styled replacement for prompt) */
const sheet = $("phoneSheet");
function openPhone() {
  $("phoneInput").value = user.phone;
  sheet.classList.add("open"); sheet.setAttribute("aria-hidden", "false");
  setTimeout(() => $("phoneInput").focus(), 50);
}
function closePhone() { sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); $("btnPhone").focus(); }
$("btnPhone").addEventListener("click", openPhone);
$("phoneCancel").addEventListener("click", closePhone);
sheet.addEventListener("click", e => { if (e.target === sheet) closePhone(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (sheet.classList.contains("open")) closePhone();
  else if ($("picker").classList.contains("open")) togglePicker(false);
});
$("phoneForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("phoneInput").value.trim();
  if (v === "") {                       // empty = remove number
    user.phone = ""; store.set("phone", null);
    paintPhone(); drawDot(); closePhone();
    toast("Mobile number removed", "info");
    return;
  }
  const digits = v.replace(/[\s\-().]/g, "");
  if (!/^\+?\d{8,15}$/.test(digits)) { toast("Please enter a valid mobile number", "error"); $("phoneInput").focus(); return; }
  user.phone = digits; store.set("phone", digits);
  paintPhone(); drawDot(); closePhone();
  toast("Mobile number saved", "ok");
});

/* initials picker */
function buildGrid() {
  const frag = document.createDocumentFragment();
  for (const a of ABC) for (const b of ABC) {
    const btn = document.createElement("button");
    btn.type = "button"; btn.textContent = a + b;
    frag.appendChild(btn);
  }
  $("grid").appendChild(frag);
  $("grid").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    user.initials = b.textContent; store.set("initials", user.initials);
    paintInitials(); togglePicker(false); drawDot();
    toast(`Initials set to ${user.initials}`, "ok");
    if (!user.pos) askGPS();
  });
}
function togglePicker(open) {
  const p = $("picker");
  open = open ?? !p.classList.contains("open");
  p.classList.toggle("open", open);
  p.setAttribute("aria-hidden", String(!open));
  $("btnInitials").setAttribute("aria-expanded", String(open));
  if (open) {
    const sel = p.querySelector("button.selected");
    if (sel) setTimeout(() => sel.scrollIntoView({ block: "center", behavior: "smooth" }), 200);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}
$("btnInitials").addEventListener("click", e => { e.stopPropagation(); togglePicker(); });
$("pickerClose").addEventListener("click", e => { e.stopPropagation(); togglePicker(false); });

/* ---------- map ---------- */
const KM_PER_DEG_LAT = 110.574;
function toMap(lat, lon) {
  const midLat = (TOP_LEFT.lat - AREA_KM / KM_PER_DEG_LAT / 2) * Math.PI / 180;
  const kmPerDegLon = 111.320 * Math.cos(midLat);
  const xKm = (lon - TOP_LEFT.lon) * kmPerDegLon;   // east of the top-left corner
  const yKm = (TOP_LEFT.lat - lat) * KM_PER_DEG_LAT; // south of the top-left corner
  return { x: xKm / AREA_KM * 100, y: yKm / AREA_KM * 100 };
}

function drawDot() {
  const box = $("mapBox");
  let dot = box.querySelector(".dot"), acc = box.querySelector(".acc");
  if (!user.pos || !user.initials) { dot?.remove(); acc?.remove(); return; }
  const fresh = !dot;
  if (fresh) {
    acc = document.createElement("div"); acc.className = "acc"; box.appendChild(acc);
    dot = document.createElement("div"); dot.className = "dot"; dot.tabIndex = 0;
    dot.addEventListener("click", e => { e.stopPropagation(); dot.classList.toggle("show"); });
    box.appendChild(dot);
  }
  const s = HEART_STATES[user.heart] || HEART_STATES[0];
  dot.style.left = user.pos.x + "%";
  dot.style.top  = user.pos.y + "%";
  dot.classList.toggle("edge-l", user.pos.x < 14);
  dot.classList.toggle("edge-r", user.pos.x > 86);
  dot.classList.toggle("edge-b", user.pos.y > 72);   // keep the label clear of the bottom chip
  dot.style.backgroundColor = s.color;
  dot.style.setProperty("--pulse", s.color);
  dot.innerHTML = "";
  dot.append(user.initials);
  const tip = document.createElement("span"); tip.className = "tip";
  if (user.phone) {
    const a = document.createElement("a"); a.href = "tel:" + user.phone; a.textContent = user.phone;
    a.addEventListener("click", e => e.stopPropagation());
    tip.append("📱 ", a);
  } else tip.textContent = s.text;
  dot.appendChild(tip);
  if (user.loc) {
    const lbl = document.createElement("span"); lbl.className = "lbl";
    lbl.innerHTML = `<b></b><b></b>`;
    lbl.children[0].textContent = fmtLat(user.loc.lat);
    lbl.children[1].textContent = fmtLon(user.loc.lon);
    dot.appendChild(lbl);
  }

  const d = Math.min(200, Math.max(0, user.pos.acc || 0)); // accuracy circle diameter in % of map
  acc.style.left = user.pos.x + "%"; acc.style.top = user.pos.y + "%";
  acc.style.width = acc.style.height = d + "%";
  acc.style.display = d > 1.5 ? "block" : "none";
}

/* ---------- location: GPS on https, IP estimate on http (or if GPS is refused) ---------- */
function dms(v, pos, neg) {
  const h = v < 0 ? neg : pos; v = Math.abs(v);
  let d = Math.floor(v), m = Math.floor((v - d) * 60), sec = ((v - d) * 60 - m) * 60;
  if (sec >= 59.95) { sec = 0; m++; } if (m === 60) { m = 0; d++; }
  return `${d}°${String(m).padStart(2, "0")}'${sec.toFixed(1).padStart(4, "0")}"${h}`;
}
const fmtLat = lat => dms(lat, "N", "S");
const fmtLon = lon => dms(lon, "E", "W");
function fmtAcc(m) { return m >= 1000 ? `±${(m / 1000).toFixed(m >= 10000 ? 0 : 1)} km` : `±${Math.round(m)} m`; }

function showCoords(loc) {
  const chip = $("mapCoords");
  chip.querySelector(".ll").textContent = `${fmtLat(loc.lat)}  ${fmtLon(loc.lon)}`;
  chip.querySelector(".meta").textContent = `${fmtAcc(loc.acc)} · ${loc.src === "gps" ? "GPS" : "IP estimate"}`;
  chip.classList.add("show");
  $("coords").textContent = `${loc.lat.toFixed(6)}, ${loc.lon.toFixed(6)}`;
}

let lastWarn = "";
let best = null;            // the most precise fix so far
function onLocation(loc) {
  // never let a coarse IP estimate replace a real GPS fix
  if (best && best.src === "gps" && loc.src !== "gps") return;
  best = loc;
  user.loc = loc;
  const m = toMap(loc.lat, loc.lon);
  const box = $("mapBox");
  box.classList.remove("locating");
  showCoords(loc);

  if (m.x < 0 || m.x > 100 || m.y < 0 || m.y > 100) {
    user.pos = null; drawDot();
    box.classList.remove("ready");
    $("mapMsgText").textContent = `You are outside the ${AREA_KM} km × ${AREA_KM} km Sydney area`;
    if (lastWarn !== "range") toast("you are out of range", "warn");
    lastWarn = "range";
    return;
  }
  user.pos = { x: m.x, y: m.y, acc: (2 * loc.acc / 1000) / AREA_KM * 100 };
  box.classList.add("ready");
  if (!user.initials) {
    if (lastWarn !== "init") {
      toast("Choose your initials (top bar) to appear on the map", "warn");
      const b = $("btnInitials"); b.classList.remove("nudge"); void b.offsetWidth; b.classList.add("nudge");
    }
    lastWarn = "init";
  } else lastWarn = "";
  drawDot();
}

/* IP-based estimate: works on http:// too (no permission needed, city-level accuracy) */
const IP_SERVICES = [
  ["https://ipapi.co/json/",        j => j.latitude != null && { lat: +j.latitude, lon: +j.longitude }],
  ["https://ipwho.is/",             j => j.success !== false && j.latitude != null && { lat: +j.latitude, lon: +j.longitude }],
  ["https://get.geojs.io/v1/ip/geo.json", j => j.latitude != null && { lat: +j.latitude, lon: +j.longitude }],
  ["https://freeipapi.com/api/json", j => j.latitude != null && { lat: +j.latitude, lon: +j.longitude }]
];
let ipTried = false;
async function ipEstimate(quiet) {
  if (ipTried) return; ipTried = true;
  $("mapBox").classList.add("locating");
  $("mapMsgText").textContent = "Estimating your location…";
  for (const [url, parse] of IP_SERVICES) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 6000);
      const r = await fetch(url, { signal: ctl.signal, cache: "no-store" }); clearTimeout(t);
      if (!r.ok) continue;
      const ll = parse(await r.json());
      if (ll && isFinite(ll.lat) && isFinite(ll.lon)) {
        onLocation({ lat: ll.lat, lon: ll.lon, acc: 5000, src: "ip" });
        if (!quiet) toast("Location estimated from your internet connection (approximate)", "info");
        return;
      }
    } catch {}
  }
  ipTried = false;
  $("mapBox").classList.remove("locating");
  $("mapMsgText").textContent = "Tap anywhere on the page to share your location";
  toast("Could not estimate your location", "error");
}

const canGPS = () => window.isSecureContext && "geolocation" in navigator;
let watching = false;
function askGPS() {
  if (!canGPS()) { ipEstimate(); return; }       // http:// → browsers block GPS, use IP estimate
  if (watching) return;
  watching = true;
  $("mapBox").classList.add("locating");
  $("mapMsgText").textContent = "Locating you…";
  navigator.geolocation.watchPosition(
    p => onLocation({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, src: "gps" }),
    err => {
      watching = false;
      if (err.code === err.PERMISSION_DENIED) toast("Please allow location access to see yourself on the map", "error", { duration: 5000 });
      else toast("Could not get a GPS fix, tap to try again", "warn");
      if (!best) ipEstimate(true);               // fall back to an approximate position
      else $("mapBox").classList.remove("locating");
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
}

function initMap() {
  const box = $("mapBox"), img = $("mapImg");
  img.onload = () => {
    // make the box follow the image's aspect ratio so % positions stay exact
    if (img.naturalWidth && img.naturalHeight) box.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
    box.classList.add("loaded");
  };
  img.onerror = () => box.classList.add("noimg");
  img.src = MAP_IMAGE;

  // tap anywhere asks for the GPS location (needs a user gesture on many browsers)
  document.addEventListener("click", e => {
    if (e.target.closest(".nav2, .nav1, #picker, .sheet-bg, .donate, #toasts, #mapCoords")) return;
    document.querySelectorAll(".dot.show").forEach(d => { if (!d.contains(e.target)) d.classList.remove("show"); });
    askGPS();
  });

  if (!canGPS()) {
    // http:// (or no GPS): estimate straight away, nothing to tap
    ipEstimate(true);
  } else {
    // https://: if permission was granted earlier locate now, otherwise show a rough estimate until the user taps
    const fallback = () => ipEstimate(true);
    if (navigator.permissions?.query) {
      navigator.permissions.query({ name: "geolocation" })
        .then(r => { r.state === "granted" ? askGPS() : fallback(); })
        .catch(fallback);
    } else fallback();
  }
}

/* ---------- init ---------- */
$("donate").href = STRIPE_LINK;
renderFlags();
buildGrid();
paintHeart();
paintPhone();
paintInitials();
initMap();
</script>
</body>
</html>
